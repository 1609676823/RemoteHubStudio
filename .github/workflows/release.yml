name: Stable Release

on:
  workflow_call:
    inputs:
      deployment-mode:
        type: string
        default: repository-default
  workflow_dispatch:
    inputs:
      deployment-mode:
        description: Deployment mode (already published stable assets are preserved)
        type: choice
        default: repository-default
        options:
          - repository-default
          - self-contained
          - framework-dependent
          - both
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  # Serialize standalone, tag-triggered, and parent-triggered stable publications.
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check whether the current version needs a stable release
    if: github.repository == '1609676823/RemoteHubStudio' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-build: ${{ steps.prepare.outputs.should-build }}
      published-tag: ${{ steps.prepare.outputs.published-tag }}
      tag: ${{ steps.prepare.outputs.tag }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve stable version and source
        id: prepare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./.github/scripts/prepare-stable-release.ps1

  update-title:
    name: Update existing stable release title
    needs: prepare
    if: needs.prepare.outputs.published-tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Use the version tag as the release title
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.published-tag }}
        run: gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG"

  build:
    needs: prepare
    if: needs.prepare.outputs.should-build == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      channel: stable
      deployment-mode: ${{ inputs.deployment-mode || 'repository-default' }}
      source-ref: ${{ needs.prepare.outputs.commit }}
      expected-tag: ${{ needs.prepare.outputs.tag }}

  release:
    name: Publish stable version
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out publishing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Existing version tags may predate the current publishing scripts.
          # Use this workflow's logic to publish binaries from the resolved source commit.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download tested release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artifacts
          merge-multiple: true

      - name: Publish stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: stable
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: bash .github/scripts/publish-release.sh
